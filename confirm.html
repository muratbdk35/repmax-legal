<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepMax – E-posta Doğrulandı</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0d4cb, #e2d6ee, #cfddf0);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      border: 1px solid rgba(255,255,255,0.9);
    }
    .logo {
      width: 140px;
      margin-bottom: 32px;
    }
    .check {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 24px rgba(34,197,94,0.4);
    }
    .check svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #161310;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #4A443F;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 13px;
      color: #7A726B;
      margin-top: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(232,56,12,0.10);
      color: #E8380C;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(232,56,12,0.20);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://muratbdk35.github.io/repmax-legal/repmax.png" alt="RepMax" onerror="this.style.display='none'">
    <div class="badge">HYPERTROPHY TRACKER</div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>E-posta Doğrulandı! ✓</h1>
    <p>Hesabın başarıyla onaylandı.</p>
    <p>Artık RepMax uygulamasını açabilirsin.</p>
    <p class="sub">Bu sayfayı kapatıp uygulamaya dönebilirsin.</p>
  </div>
</body>
</html>
